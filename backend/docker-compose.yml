version: "3.8"

services:
   postgres:
      image: postgres:16-alpine
      container_name: finance_postgres
      environment:
         POSTGRES_USER: docker
         POSTGRES_PASSWORD: docker
         POSTGRES_DB: financeapp
      ports:
         - "5432:5432"
      volumes:
         - pgdata:/var/lib/postgresql/data

volumes:
   pgdata:
