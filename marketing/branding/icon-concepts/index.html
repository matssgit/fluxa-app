function phone(k){const dark=st.theme==='dark',ink=dark?'#fff':C.ink,wall=dark?`radial-gradient(120% 70% at 80% 8%,#22424B 0%,#16252B 45%,${C.night} 100%)`:`radial-gradient(120% 70% at 20% 5%,${C.cream} 0%,${C.paper} 45%,#E3DED3 100%)`;
