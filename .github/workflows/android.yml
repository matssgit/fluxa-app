name: Android

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install Android SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Build and check
        run: >-
          bash gradlew :app:assembleDebug :app:assembleRelease :app:lint
          :app:testDebugUnitTest :app:assembleDebugAndroidTest
      - name: Verify exported Room schema
        run: |
          test -f app/schemas/com.fluxa.personal.data.database.FluxaDatabase/1.json
          test -z "$(git status --porcelain -- app/schemas)"
